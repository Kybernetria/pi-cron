[package]
name = "pi-cron-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
tokio = { version = "1.48", features = ["full", "process"] }
tokio-util = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "3"
uuid = { version = "1", features = ["v4"] }
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
